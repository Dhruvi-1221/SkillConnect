{% extends 'base.html' %}

{% block title %}Edit Post - SkillConnect{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding-top: 3rem; padding-bottom: 5rem;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
      <h1 style="font-size: 2rem; font-weight: 800;">Edit Post</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Update the caption, tags, or category</p>
    </div>
    <a href="{% url 'post_detail' post.id %}" class="btn btn-secondary">View Post</a>
  </div>

  <div class="form-card">
    <div style="margin-bottom: 1.5rem; text-align: center;">
      <img src="{{ post.image.url }}" alt="Preview" style="max-height: 250px; margin: 0 auto; border-radius: var(--radius-md);">
    </div>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label" for="id_category">Category</label>
        {{ form.category }}
      </div>

      <div class="form-group">
        <label class="form-label" for="id_caption">Caption</label>
        {{ form.caption }}
      </div>

      <div class="form-group">
        <label class="form-label" for="id_skill_tags">Skill Tags</label>
        {{ form.skill_tags }}
      </div>

      <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary btn-lg">Save Changes</button>
        <a href="{% url 'manage_posts' %}" class="btn btn-secondary btn-lg">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
